<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>git101</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f1ec;
    --ink: #21262b;
    --ink-soft: #565c62;
    --accent: #3c6e71;
    --accent-soft: #dce6e5;
    --rule: #d8d4ca;
    --card-bg: #fbfaf7;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1e20;
      --ink: #ece9e2;
      --ink-soft: #a7ada9;
      --accent: #6fa8a0;
      --accent-soft: #2a3634;
      --rule: #34383a;
      --card-bg: #212527;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1b1e20;
    --ink: #ece9e2;
    --ink-soft: #a7ada9;
    --accent: #6fa8a0;
    --accent-soft: #2a3634;
    --rule: #34383a;
    --card-bg: #212527;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 1.5rem;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  main {
    width: 100%;
    max-width: 30rem;
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 3rem 2.5rem 2.25rem;
    text-align: center;
  }

  .eyebrow {
    margin: 0 0 1.25rem;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  h1 {
    margin: 0 0 0.75rem;
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    text-wrap: balance;
    color: var(--ink);
  }

  p.tagline {
    margin: 0 0 2rem;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: 1.05rem;
    color: var(--ink-soft);
  }

  .rule {
    height: 1px;
    background: var(--rule);
    margin: 0 0 1.5rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.78rem;
    padding: 0.4rem 0.8rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  .badge::before {
    content: "";
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: var(--accent);
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">git101 · live page</p>
    <h1>Hello, World!</h1>
    <p class="tagline">You just watched this update after a push. That's the loop.</p>
    <div class="rule"></div>
    <span class="badge">rev 2 · second commit</span>
  </main>
</body>
</html>
